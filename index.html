<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#9fd1a6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e4a2a" media="(prefers-color-scheme: dark)" />
    <script>
      /* Applies the saved or system colour scheme before first paint (see src/hooks/useDarkMode.js). */
      (function () {
        var dark = false;
        try {
          var saved = localStorage.getItem('bahia-lectora:theme');
          dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {}
        var root = document.documentElement;
        if (dark) root.classList.add('dark');
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <title>Bahía Lectora</title>

    <!-- og:start -->
    <meta name="description" content="Bahía Lectora - club de lectura" />
    <link rel="canonical" href="https://bahia-lectora.jzmarquez.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bahía Lectora" />
    <meta property="og:title" content="Bahía Lectora" />
    <meta property="og:description" content="Bahía Lectora - club de lectura" />
    <meta property="og:image" content="https://bahia-lectora.jzmarquez.com/logo.webp" />
    <meta property="og:url" content="https://bahia-lectora.jzmarquez.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- og:end -->
  </head>
  <body>
    <noscript>Necesitas activar JavaScript para usar esta aplicación.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
