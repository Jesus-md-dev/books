name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Syntax-check the build scripts: `npm test` does not load fetchBooksData.js, which Netlify runs as `prebuild`.
      - run: for f in scripts/*.js netlify/functions/*.js; do node --check "$f"; done

      - run: npm test

      # Not `npm run build`: its prebuild fetches the Google Sheet and needs credentials.
      # The generated src/data/*.json files are committed, so vite build works without them.
      - run: npx vite build
